services:
  # Quorum Unified Web Application & Verification API Service
  - type: web
    name: quorum-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_OWNER
        value: yashnanavare6
      - key: GITHUB_REPO
        value: Bit
      - key: GITHUB_WORKFLOW
        value: verify.yml
      - key: GITHUB_TOKEN
        sync: false # Add your GitHub Personal Access Token in Render Dashboard
